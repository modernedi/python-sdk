name: Publish package
run-name: Publish ${{ inputs.version }} from ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed preview or release version
        required: true
        type: string
      source_sha:
        description: Exact reviewed public main commit
        required: true
        type: string
      source_revision:
        description: Exact verified upstream revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: registry-publish
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.repository == 'modernedi/python-sdk' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require reviewed main before checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/verify-public-source.mjs
      - name: Require verified upstream source
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision }}
        run: node scripts/check-release-source.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install . build==1.3.0 twine==7.0.0
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check-package.py check python
      - name: Test installed wheel, not source imports
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          python -I -m unittest discover -s tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require reviewed main before checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/verify-public-source.mjs
      - name: Require verified upstream source
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision }}
        run: node scripts/check-release-source.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package
          path: dist/
      - name: Validate artifacts, deployed contract, and unused version before one upload
        run: python scripts/check-package.py preflight python
      - name: Publish to PyPI with trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      - run: python scripts/check-package.py registry python
      - name: Fresh registry installation and full offline contract suite
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/registry-python"
          "$RUNNER_TEMP/registry-python/bin/python" -m pip install --no-cache-dir --index-url https://pypi.org/simple "modernedi-sdk==$EXPECTED_VERSION"
          "$RUNNER_TEMP/registry-python/bin/python" -m pip check
          "$RUNNER_TEMP/registry-python/bin/python" -I -m unittest discover -s tests
